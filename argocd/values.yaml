global:
  domain: argocd.lab.home

configs:
  params:
    server.insecure: true
    applicationsetcontroller.enable.new.git.file.globbing: true
    controller.log.level: warn
    applicationsetcontroller.log.level: warn
    server.log.level: warn
    reposerver.log.level: warn
  cm:
    kustomize.buildOptions: --enable-helm
    helm.oci.enabled: "true"
  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, repositories, *, *, allow
      p, role:admin, projects, *, *, allow

dex:
  enabled: false

redis-ha:
  enabled: false

redis:
  auth: false

redisSecretInit:
  enabled: false

server:
  insecure: true
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  metrics:
    enabled: true

controller:
  replicas: 1
  metrics:
    enabled: true

repoServer:
  replicas: 1
  metrics:
    enabled: true

applicationSet:
  replicas: 1
  metrics:
    enabled: true

notifications:
  enabled: false
