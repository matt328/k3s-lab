apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

components:
  - ../../../components/lab-network

resources:
  - dashboards/application-fleet-overview.yaml
  - dashboards/service-drilldown.yaml
  - dashboards/migration-watch.yaml

helmCharts:
  - name: grafana
    repo: https://grafana.github.io/helm-charts
    version: 10.5.15
    releaseName: grafana
    namespace: observability
    valuesFile: values.yaml
