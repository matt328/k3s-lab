apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-drilldown
  labels:
    grafana_dashboard: "1"
data:
  service-drilldown.json: |
    {
      "uid": "service-drilldown",
      "title": "Service Drilldown",
      "tags": ["applications", "service", "drilldown"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(http_server_requests_seconds_count, cluster)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "refresh": 1
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(http_server_requests_seconds_count{cluster=~\"$cluster\"}, namespace)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "refresh": 1
          },
          {
            "name": "workload",
            "label": "Workload",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(http_server_requests_seconds_count{cluster=~\"$cluster\",namespace=~\"$namespace\"}, workload)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "refresh": 1
          },
          {
            "name": "uri",
            "label": "URI",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(http_server_requests_seconds_count{cluster=~\"$cluster\",namespace=~\"$namespace\",workload=~\"$workload\",uri!~\"/actuator/.*\"}, uri)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate by URI",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (uri, status) (rate(http_server_requests_seconds_count{cluster=~\"$cluster\",namespace=~\"$namespace\",workload=~\"$workload\",uri=~\"$uri\"}[$__rate_interval]))",
              "legendFormat": "{{uri}} {{status}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Latency p50/p95/p99",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "p50",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{cluster=~\"$cluster\",namespace=~\"$namespace\",workload=~\"$workload\",uri=~\"$uri\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "refId": "p95",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{cluster=~\"$cluster\",namespace=~\"$namespace\",workload=~\"$workload\",uri=~\"$uri\"}[$__rate_interval])))",
              "legendFormat": "p95"
            },
            {
              "refId": "p99",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{cluster=~\"$cluster\",namespace=~\"$namespace\",workload=~\"$workload\",uri=~\"$uri\"}[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "JVM heap used",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(jvm_memory_used_bytes{cluster=~\"$cluster\",namespace=~\"$namespace\",workload=~\"$workload\",area=\"heap\"})",
              "legendFormat": "heap used"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Process CPU",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "avg(process_cpu_usage{cluster=~\"$cluster\",namespace=~\"$namespace\",workload=~\"$workload\"})",
              "legendFormat": "cpu"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod restarts",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\",pod=~\"$workload-[a-z0-9]+-[a-z0-9]+\"}[$__range]))",
              "legendFormat": "{{pod}} {{container}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 6,
          "type": "logs",
          "title": "Recent logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 15 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "refId": "A",
              "expr": "{cluster=~\"$cluster\",namespace=~\"$namespace\",workload=~\"$workload\"} | json",
              "queryType": "range"
            }
          ],
          "options": { "dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": true, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true }
        }
      ]
    }
