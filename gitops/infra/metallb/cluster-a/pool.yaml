apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: cluster-a-lan
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  addresses:
    - 192.168.50.240-192.168.50.244
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: cluster-a-lan
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ipAddressPools:
    - cluster-a-lan
