deployment:
  replicas: 2

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    publishedService:
      enabled: true
  kubernetesGateway:
    enabled: false

service:
  enabled: true
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.50.245
  spec:
    type: LoadBalancer

logs:
  general:
    level: INFO

metrics:
  prometheus:
    service:
      enabled: true
