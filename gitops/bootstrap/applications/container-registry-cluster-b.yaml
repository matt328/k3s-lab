apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: container-registry-cluster-b
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: platform
  source:
    targetRevision: main
    path: gitops/infra/container-registry/cluster-b
  destination:
    name: cluster-b
    namespace: container-registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
