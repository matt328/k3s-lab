apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-cluster-b
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform
  source:
    targetRevision: main
    path: gitops/infra/traefik/cluster-b
  destination:
    name: cluster-b
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
