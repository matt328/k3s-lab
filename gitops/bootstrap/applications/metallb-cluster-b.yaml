apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-cluster-b
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    targetRevision: main
    path: gitops/infra/metallb/cluster-b
  destination:
    name: cluster-b
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
