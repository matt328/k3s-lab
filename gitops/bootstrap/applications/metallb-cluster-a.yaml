apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-cluster-a
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: https://github.com/matt328/k3s-lab.git
    targetRevision: main
    path: gitops/infra/metallb/cluster-a
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
