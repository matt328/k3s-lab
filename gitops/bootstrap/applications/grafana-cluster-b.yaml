apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-cluster-b
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: platform
  source:
    repoURL: https://github.com/matt328/k3s-lab.git
    targetRevision: main
    path: gitops/infra/grafana/cluster-b
  destination:
    name: cluster-b
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
