apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-service-cluster-a
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  project: platform
  source:
    repoURL: https://github.com/matt328/k3s-lab.git
    targetRevision: main
    path: gitops/apps/spring-demo/cluster-a/order-service
  destination:
    server: https://kubernetes.default.svc
    namespace: spring-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
