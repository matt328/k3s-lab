apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - project.yaml
  - applications/argocd.yaml
  - applications/metallb-cluster-a.yaml
  - applications/metallb-cluster-b.yaml
  - applications/traefik-cluster-a.yaml
  - applications/traefik-cluster-b.yaml
  - applications/argocd-ingress-cluster-a.yaml
  - applications/artifact-registry-cluster-b.yaml
  - applications/container-registry-cluster-b.yaml
  - applications/minio-cluster-b.yaml
  - applications/loki-cluster-b.yaml
  - applications/tempo-cluster-b.yaml
  - applications/prometheus-cluster-b.yaml
  - applications/grafana-cluster-b.yaml
  - applications/observability-ingress-cluster-b.yaml
  - applications/alloy-cluster-a.yaml
  - applications/alloy-cluster-b.yaml
  - applicationsets/spring-demo-cluster-a.yaml
  - applicationsets/spring-demo-cluster-b-enabled.yaml
  - applicationsets/spring-demo-migration-routes-cluster-a.yaml

configMapGenerator:
  - name: gitops-repo-config
    envs:
      - repo-config.env
    options:
      annotations:
        config.kubernetes.io/local-config: "true"

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: gitops-repo-config
      fieldPath: data.GITOPS_REPO_URL
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: AppProject
        fieldPaths:
          - spec.sourceRepos.0
        options:
          create: true
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
        fieldPaths:
          - spec.source.repoURL
        options:
          create: true
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: ApplicationSet
        fieldPaths:
          - spec.generators.0.git.repoURL
          - spec.template.spec.source.repoURL
        options:
          create: true
