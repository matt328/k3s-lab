apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spring-demo-migration-routes-cluster-a
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  goTemplate: true
  generators:
    - git:
        revision: main
        directories:
          - path: gitops/apps/spring-demo/migration-routes/*
  template:
    metadata:
      name: "spring-demo-migration-route-{{ .path.basename }}"
      namespace: argocd
    spec:
      project: platform
      source:
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: spring-demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - CreateNamespace=true
          - ServerSideApply=true
