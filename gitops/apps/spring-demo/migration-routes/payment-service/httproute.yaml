apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment-service-migration
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: payment-service
      port: 80
  rules:
    - backendRefs:
        - name: payment-service
          port: 80
          weight: 100
        - name: payment-service-cluster-b
          port: 80
          weight: 0
