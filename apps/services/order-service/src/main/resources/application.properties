spring.application.name=order-service
app.environment=${APP_ENVIRONMENT:local}
app.order-api-version=${ORDER_API_VERSION:0.1.0}
app.payment-api-version=${PAYMENT_API_VERSION:0.1.0}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.build.enabled=true
management.info.env.enabled=true
management.info.git.enabled=true
management.info.git.mode=full
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.minimum-expected-value.http.client.requests=1ms
management.metrics.distribution.maximum-expected-value.http.client.requests=10s
management.tracing.enabled=true
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo.b.lab.home/v1/traces}

spring.cloud.openfeign.micrometer.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
payments.name=payment-service
payments.url=${PAYMENT_SERVICE_URL:http://payment-service}

info.app.name=${spring.application.name}
info.app.description=Order service
info.app.environment=${app.environment}
info.app.order-api-version=${app.order-api-version}
info.app.payment-api-version=${app.payment-api-version}
