{{- if and .Values.ingress.enabled .Values.ingress.useHttpRoute }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "spring-boot.fullname" . }}
  labels:
    {{- include "spring-boot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway.name }}
      namespace: {{ .Values.ingress.gateway.namespace }}
  {{- with .Values.ingress.hosts }}
  hostnames:
    {{- range . }}
    - {{ .host | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- range .paths }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path }}
      backendRefs:
        - name: {{ include "spring-boot.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
    {{- end }}
{{- end }}
